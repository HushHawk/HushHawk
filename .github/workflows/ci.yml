name: HushHawk CI & Core Foundation Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-verification:
    name: Core Foundation & Acceptance Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hushhawk_ci
          POSTGRES_USER: hushhawk_ci
          POSTGRES_PASSWORD: hushhawk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hushhawk_ci -d hushhawk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://hushhawk_ci:hushhawk_ci@127.0.0.1:5432/hushhawk_ci?sslmode=disable

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Migrate and back up a fresh database
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:backup

      - name: Verify CrownKey Deterministic Standard
        run: npm run test:crownkey

      - name: Core engine acceptance tests (auth, numbering, attribution, compliance, imports)
        run: npm test

      - name: Verify Real-Time Operational Notifications
        run: npm run test:notifications

      - name: Verify Direct Mail Tracking
        run: npm run test:direct-mail

      - name: Verify Private Vault Storage in Development Mode
        run: |
          node backend/src/server.js &
          sleep 4
          npm run test:s3

      - name: Build Production Frontend
        run: npm run build

