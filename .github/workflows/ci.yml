name: HushHawk CI & Core Foundation Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-verification:
    name: Core Foundation & Acceptance Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      AWS_S3_BUCKET: hushhawk-private-property-vault

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify CrownKey Deterministic Standard
        run: npm run test:crownkey

      - name: Verify 12 Platform Acceptance Tests
        run: npm run test:acceptance

      - name: Run Milestone 1 Exit Check
        run: npm run test:milestone1

      - name: Verify Real-Time Operational Notifications
        run: npm run test:notifications

      - name: Verify Bulk Lead Ingestion & Skip-Trace Processing
        run: npm run test:leads

      - name: Verify Blueprint Subsystems (Mail, Call, SMS, CRM, Tasks, Audit)
        run: npm run test:subsystems

      - name: Verify AWS S3 Private Vault Storage
        run: |
          node backend/src/server.js &
          sleep 3
          npm run test:s3

      - name: Build Production Frontend
        run: npm run build

