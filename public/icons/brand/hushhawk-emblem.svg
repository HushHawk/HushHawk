<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <!-- HushHawk Deep Obsidian Shield Background -->
  <rect width="36" height="36" rx="8" fill="#0A1128"/>
  <rect x="1" y="1" width="34" height="34" rx="7" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.8"/>
  
  <defs>
    <linearGradient id="goldGrad" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="10" y1="5" x2="26" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- CrownKey Regal Crest (Top) -->
  <path d="M12 9.5L14 13.5L18 7.5L22 13.5L24 9.5L25 15.5H11L12 9.5Z" fill="url(#crownGrad)"/>
  <circle cx="18" cy="11.5" r="1.2" fill="#0A1128"/>
  
  <!-- HushHawk Falcon / Hawk Wings & Talons -->
  <!-- Left Wing Spread -->
  <path d="M6 14.5C10 16 14 19 16.5 22L13 23C9 20 6.5 17 6 14.5Z" fill="url(#goldGrad)"/>
  <path d="M7.5 19C10.5 20.5 14 23 15.5 25L13.5 26C10 23.5 8 21 7.5 19Z" fill="url(#goldGrad)" fill-opacity="0.9"/>
  
  <!-- Right Wing Spread -->
  <path d="M30 14.5C26 16 22 19 19.5 22L23 23C27 20 29.5 17 30 14.5Z" fill="url(#goldGrad)"/>
  <path d="M28.5 19C25.5 20.5 22 23 20.5 25L22.5 26C26 23.5 28 21 28.5 19Z" fill="url(#goldGrad)" fill-opacity="0.9"/>
  
  <!-- Hawk Central Breast, Beak & Keyhole -->
  <path d="M18 14L15.5 19.5L18 29L20.5 19.5L18 14Z" fill="url(#goldGrad)"/>
  <path d="M18 15.5L16.8 19L18 22L19.2 19L18 15.5Z" fill="#FFFBEB"/>
  <!-- Keyhole Eye / CrownKey Heart -->
  <circle cx="18" cy="18.5" r="1" fill="#0A1128"/>
  <path d="M17.5 19.5H18.5L18.8 22H17.2L17.5 19.5Z" fill="#0A1128"/>
  
  <!-- Sleek Base Talon Notch -->
  <path d="M16 29L18 31.5L20 29H16Z" fill="url(#goldGrad)"/>
</svg>